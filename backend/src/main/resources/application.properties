# ==============================================================================
# InsecurePay Backend - Configuracion de la Billetera Digital (endurecida)
# Los valores sensibles se inyectan por variables de entorno (ver .env.example)
# ==============================================================================

server.port=8080

# Configuracion de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:insecure_pay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# [REMEDIACION A05:2021] Consola H2 deshabilitada por defecto y nunca expuesta a otros hosts.
# Para depuracion local: H2_CONSOLE_ENABLED=true (solo accesible desde localhost).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.show-sql=false

# [REMEDIACION A05:2021 - CWE-209] Sin fuga de trazas ni detalles internos en errores HTTP
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
# Respuestas de error con formato RFC 7807 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# [REMEDIACION A02:2021] Secreto JWT externalizado (minimo 256 bits = 32 bytes).
# Si JWT_SECRET no esta definida, se genera una clave aleatoria efimera al iniciar
# (los tokens dejan de ser validos al reiniciar el servidor).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# [REMEDIACION A05:2021] CORS restringido al origen del frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
